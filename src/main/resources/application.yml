# BE_subject_pathway - Spring Boot 4.1.0
# Credentials come from environment variables (see .env.example); never hardcode.
spring:
  application:
    name: BE_subject_pathway
  config:
    import: optional:file:.env[.properties]
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/edu_guidance}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate   # NEVER use update/create - database-first, schema owned by DB
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}
    database: ${NEO4J_DATABASE:edugraph}

# CORS - danh sach origin FE duoc phep, phan cach bang dau phay
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}