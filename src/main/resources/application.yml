# BE_subject_pathway - Spring Boot 4.1.0
# Credentials come from environment variables (see .env.example); never hardcode.
spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  application:
    name: BE_subject_pathway
  config:
    import: optional:file:.env[.properties]
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/edu_guidance}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate   # NEVER use update/create - database-first, schema owned by DB
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}
    database: ${NEO4J_DATABASE:edugraph}

# CORS - danh sach origin FE duoc phep, phan cach bang dau phay
app:
  locations:
    api-url: ${PROVINCES_API_URL:https://34tinhthanh.com/api/provinces}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    redis-key-prefix: ${AUTH_REDIS_KEY_PREFIX:subject-pathway:auth:}
  storage:
    provider: ${OBJECT_STORAGE_PROVIDER:MINIO}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}}
    bucket: ${OBJECT_STORAGE_BUCKET:}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    access-key-id: ${OBJECT_STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:}
    presigned-url-ttl-seconds: ${OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS:300}
    max-upload-bytes: ${PDF_MAX_UPLOAD_BYTES:52428800}
  bootstrap:
    super-admin-username: ${BOOTSTRAP_SUPER_ADMIN_USERNAME:}
    super-admin-password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
